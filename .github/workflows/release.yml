name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Zależności systemowe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcursor-dev libfontconfig1-dev libfreetype6-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Pakiet
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          for bin in luna-terminal; do
            cp "target/release/$bin" dist/
          done
          (cd dist && sha256sum * > SHA256SUMS)
          tar -czf "${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C dist .

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          generate_release_notes: true

  distro:
    needs: build
    uses: LunaDesktop/luna/.github/workflows/distro-packages.yml@main
    with:
      package: "luna-terminal"
      description: "Luna Terminal — emulator terminala"
      binaries: "luna-terminal"
      files: |
        packaging/eu.luna.Terminal.desktop:/usr/share/applications/eu.luna.Terminal.desktop:644
      deb_depends: "libc6,libxkbcommon0,libxcursor1,libwayland-client0"
      rpm_depends: "glibc,libxkbcommon,libXcursor,libwayland-client"
      arch_depends: "glibc,libxkbcommon,libxcursor,wayland"

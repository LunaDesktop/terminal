[package]
name = "luna-terminal"
version = "0.0.4"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"
authors = ["Patryk Szkudlarek / libLuna contributors"]
description = "Luna Terminal — emulator terminala środowiska Luna (libLuna, PTY, VT100/xterm)."
# Po utworzeniu osobnego repozytorium ustaw np.:
# repository = "https://github.com/mijsys/luna-terminal"

[workspace]
resolver = "2"

[dependencies]
libluna-core = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.7" }
libluna-i18n = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.7" }
libluna-render = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.7" }
libluna-platform = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.7" }
libluna-widgets = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.7" }
libc = "0.2"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
